services:
  mongodb:
    image: mongo:latest
    container_name: handball-scout-db
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: handball-scout-backend
    ports:
      - "3000:3000"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/handball-scout
    depends_on:
      - mongodb

volumes:
  mongodb_data:
