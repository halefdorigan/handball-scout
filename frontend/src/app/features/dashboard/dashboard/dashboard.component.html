<div class="dashboard container">
  <header class="page-header">
    <h1>Dashboard</h1>
  </header>

  <div class="stats-cards">
    <div class="stat-card">
      <span class="stat-card__icon">🤾</span>
      <div class="stat-card__data">
        <span class="stat-card__label">Total de Jogos</span>
        <span class="stat-card__value">{{ totalGames$ | async }}</span>
      </div>
    </div>
    <div class="stat-card">
      <span class="stat-card__icon">⚽</span>
      <div class="stat-card__data">
        <span class="stat-card__label">Total de Gols</span>
        <span class="stat-card__value">{{ totalGoals$ | async }}</span>
      </div>
    </div>
  </div>

  <section class="recent-games">
    <h2>Jogos Recentes</h2>
    <div class="games-list">
      <div *ngFor="let game of games$ | async" class="game-item" [routerLink]="['report', game._id]">
        <div class="game-item__info">
          <span class="game-item__name">{{ game.name }}</span>
          <span class="game-item__date">{{ game.dateTime | date:'dd/MM/yyyy' }}</span>
        </div>
        <div class="game-item__score">
          Ver Relatório ➡️
        </div>
      </div>
    </div>
  </section>
</div>
