<div class="team-detail">
  <div class="team-detail__header">
    <button (click)="save()" class="btn btn--primary">Salvar</button>
  </div>

  <form [formGroup]="teamForm" class="team-form">
    <div class="form-group">
      <label>Nome do Time</label>
      <input type="text" formControlName="name" placeholder="Ex: Handebol Clube">
    </div>

    <div class="form-group">
      <label>Cor do Time</label>
      <input type="color" formControlName="color">
    </div>
  </form>

  <div class="players-section" *ngIf="!isNew">
    <h3>Jogadores</h3>
    <form [formGroup]="playerForm" (ngSubmit)="addPlayer()" class="player-form">
      <input type="number" formControlName="number" placeholder="Nº">
      <input type="text" formControlName="name" placeholder="Nome do Jogador">
      <select formControlName="position">
        <option value="Goleiro">Goleiro</option>
        <option value="Ponta">Ponta</option>
        <option value="Armador">Armador</option>
        <option value="Pivô">Pivô</option>
      </select>
      <button type="submit">+</button>
    </form>

    <div class="players-list">
      <div *ngFor="let player of players$ | async" class="player-item">
        <span class="player-item__number">{{ player.number }}</span>
        <span class="player-item__name">{{ player.name }}</span>
        <span class="player-item__pos">{{ player.position }}</span>
      </div>
    </div>
  </div>
</div>
